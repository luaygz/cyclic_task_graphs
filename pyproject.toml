[project]
name = "ctg"
version = "0.1.0"
description = "Complete cyclic subtask graphs for tool-using LLM agents (TMLR 2026)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luay Gharzeddine", email = "luaygharzeddine@gmail.com" }, { name = "Samer Saab Jr" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.99",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
alfworld = ["alfworld>=0.4.2"]
plots = ["matplotlib>=3.8"]

[project.scripts]
ctg = "ctg.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: calls real model or search APIs (costs money; opt in with -m live)",
    "alfworld: needs the alfworld extra and ALFWORLD_DATA",
    "textcraft_recipes: needs the TextCraft recipe files (ctg data fetch textcraft); skipped without them",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
